:root{
  --font-display:"Chakra Petch",system-ui,sans-serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}

:root{
  /* Scout tokens. Never pure #fff / #000. */
  --bg:#f9f7f4;          /* Sand-50   */
  --card:#fdfcfb;        /* card fill */
  --card-2:#f4f1ec;
  --ink:#18181b;         /* Zinc-900  */
  --ink-2:#3f3f46;
  --muted:#52525b;
  --faint:#7a736a;
  --border:#dcd0c1;      /* Sand-200  */
  --border-soft:#e7ded2;
  --brand:#2c867d;       /* ST Teal-700 -- see readme for why not Teal-600 */
  --brand-soft:#d1f0ec;
  --good:#2c867d;
  --warn:#d97706;
  --crit:#e11d48;
  --neutral:#866e4f;     /* Sand-600: the achromatic "no signal" slot */
  --onpole:#fdfcfb;      /* ink that sits ON a filled brand/status block */
  --code-bg:#f1ede6;
  --code-ink:#433728;
  --measure:74ch;
  --frame:1120px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#18181b; --card:#27272a; --card-2:#202023;
    --ink:#fafafa; --ink-2:#e4e4e7; --muted:#a1a1aa; --faint:#8b8b93;
    --border:#3f3f46; --border-soft:#343438;
    --brand:#3fc0b3; --brand-soft:#10302d; --good:#3fc0b3;
    --warn:#f59e0b; --crit:#fb7185; --neutral:#b9a182;
    --onpole:#18181b;
    --code-bg:#1f1f22; --code-ink:#cfbfaa;
  }
}
/* The viewer's theme toggle stamps data-theme on :root and must win over the
   media query in BOTH directions -- hence two blocks, not one. */
:root[data-theme="dark"]{
  --bg:#18181b; --card:#27272a; --card-2:#202023;
  --ink:#fafafa; --ink-2:#e4e4e7; --muted:#a1a1aa; --faint:#8b8b93;
  --border:#3f3f46; --border-soft:#343438;
  --brand:#3fc0b3; --brand-soft:#10302d; --good:#3fc0b3;
  --warn:#f59e0b; --crit:#fb7185; --neutral:#b9a182;
  --onpole:#18181b;
  --code-bg:#1f1f22; --code-ink:#cfbfaa;
}
:root[data-theme="light"]{
  --bg:#f9f7f4; --card:#fdfcfb; --card-2:#f4f1ec;
  --ink:#18181b; --ink-2:#3f3f46; --muted:#52525b; --faint:#7a736a;
  --border:#dcd0c1; --border-soft:#e7ded2;
  --brand:#2c867d; --brand-soft:#d1f0ec; --good:#2c867d;
  --warn:#d97706; --crit:#e11d48; --neutral:#866e4f;
  --onpole:#fdfcfb;
  --code-bg:#f1ede6; --code-ink:#433728;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink-2);
  font-family:var(--font-sans);font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased;font-synthesis-weight:none}

.frame{max-width:var(--frame);margin:0 auto;padding:0 28px}
.col{max-width:var(--measure)}
section{padding:52px 0;border-top:1px solid var(--border-soft)}
section:first-of-type{border-top:0}

h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;color:var(--ink);
  text-wrap:balance;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(34px,5.5vw,56px);line-height:1.04;letter-spacing:-.025em}
h2{font-size:30px;line-height:1.15}
h3{font-size:20px;line-height:1.25;font-weight:600}
h4{font-size:15px;line-height:1.3;font-weight:600}
p{margin:0 0 16px}
p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:650}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.eyebrow{font-family:var(--font-display);font-weight:600;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin:0 0 10px;display:block}
.lede{font-size:19px;line-height:1.55;color:var(--ink-2)}
.note{font-size:14px;line-height:1.6;color:var(--muted)}
code{font-family:var(--font-mono);font-size:.86em;
  background:var(--code-bg);color:var(--code-ink);padding:1px 5px;
  clip-path:polygon(2px 0,100% 0,100% calc(100% - 2px),calc(100% - 2px) 100%,0 100%,0 2px)}

/* -- THE CHAMFER ----------------------------------------------------------
   Scout cuts corners, it does not round them. Two planes: the element paints
   the 1px outline, ::before paints the fill inset by 1px.

   isolation:isolate + z-index:-1 is load-bearing. It puts the fill above the
   outline but below ALL content INCLUDING BARE TEXT NODES. The obvious
   alternative -- `.cham > * {position:relative;z-index:1}` -- only lifts
   ELEMENTS, so raw text between tags paints behind the fill and vanishes.
   That bug is invisible in source and only shows up in a render.

   Cards cut top-left + bottom-right (8px). Controls cut all four (4px).
   Badges/chips 2px. Genuinely round things keep border-radius.
   ------------------------------------------------------------------------ */
.cham{position:relative;isolation:isolate;background:var(--border);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cham::before{content:"";position:absolute;inset:1px;z-index:-1;background:var(--card);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cham.flat::before{background:var(--card-2)}

.tag{display:inline-block;font-family:var(--font-display);font-weight:600;
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;padding:5px 9px;
  background:var(--card-2);color:var(--muted);border:1px solid var(--border);
  clip-path:polygon(2px 0,calc(100% - 2px) 0,100% 2px,100% calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,0 calc(100% - 2px),0 2px)}
.tag.brand{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}

<script>
(function(){

var STREETS=[["Station Rd","Bexley",6,"gggggggggggg"],["Church Ln","Bexley",8,"gggwssgggggg"],["Park Ave","Bexley",5,"gggggggggggg"],["Mill Hill","Bexley",10,"ggggggggwggg"],["Oak Rd","Hammersmith",4,"gggggggggggg"],["Grove Pl","Hammersmith",12,"gggggggwgggg"],["King St","Hammersmith",6,"gggggggggggg"],["Elm Gr","Tower Hamlets",8,"ggggggggggwg"],["Bow Rd","Tower Hamlets",20,"gggggggggggg"],["Mile End Ln","Tower Hamlets",16,"gwgggggggggg"],["Vine St","Bexley",4,"gggggggggggg"],["Hall Pl","Bexley",6,"gggggggggggg"]];
var POSTS=["LP-11","LP-12","LP-13","LP-14","LP-15","LP-16"];
var STEPS=[
 {id:"hb",t:"Morning heartbeat",s:"06:00 &middot; every street",view:"home",what:"On Home, press <b>Run 06:00 heartbeat</b>. Each street&rsquo;s minion runs its light check: 6 steps, no AI conversation.",say:"Every street has its own agent. Nobody asked it to run; it just wakes up."},
 {id:"ask",t:"Ask the operations manager",s:"07:15 &middot; Sam, ops manager",view:"home",what:"In the operations manager panel, click <b>Which streets need me today?</b>",say:"The operations manager doesn&rsquo;t re-read 640 streets. It asks the minions for their colour. One step, no AI tokens."},
 {id:"open",t:"Open the red street",s:"Station Rd, Bexley",view:"home",what:"Click <b>Station Rd</b> in the table.",say:"One street, six lamppost chargers, one minion that knows all of it."},
 {id:"health",t:"Asset Health finds the fault",s:"LP-14 tripping",view:"street:health",what:"On the <b>Asset Health</b> tab, review LP-14 and press <b>Approve repair job</b>.",say:"Same fault as March. It asks the Specialist first, then drafts the repair before anyone has logged in."},
 {id:"pm",t:"PM Autopilot plans one visit",s:"Repair + yearly checks",view:"street:pm",what:"On <b>PM Autopilot</b>, read the plan and press <b>Approve plan</b>.",say:"This isn&rsquo;t a list of what&rsquo;s due. It bundles, checks deadlines and the van, and shows the saving."},
 {id:"parts",t:"Parts Autopilot loads the van",s:"RCD on Van 12",view:"street:parts",what:"On <b>Parts Autopilot</b>, press <b>Reserve on Van 12</b>.",say:"No second trip because the part wasn&rsquo;t on the van."},
 {id:"photos",t:"Field Verification checks photos",s:"Thu 11:40 &middot; on site",view:"street:fv",what:"On <b>Field Verification</b>, take or upload each photo on Dev&rsquo;s phone (or <b>Take all remaining photos</b>), then <b>Retake</b> the blurry one.",say:"Computer Vision is its eyes. It asks for the retake while Dev is still on the street."},
 {id:"claim",t:"Job closes: warranty claim",s:"Thu 12:05",view:"street:wb",what:"On <b>Warranty &amp; Billing</b>, press <b>Close job</b>, then <b>Review and send</b>.",say:"It drafts the claim with the evidence. A person sends it."},
 {id:"night",t:"Nightly: it remembers",s:"Thu 22:00",view:"street:log",what:"On <b>Memory &amp; log</b>, press <b>Run 22:00 nightly</b>.",say:"Next time it starts from what it learned."},
 {id:"brief",t:"Monday brief",s:"Mon 06:30",view:"brief",what:"Open <b>Monday brief</b> in the top bar.",say:"Everything the minions did, and the three things that still need a person."}
];
function fresh(){return {view:"home",tab:"overview",step:0,done:{},hb:"idle",hbi:-1,asked:false,repair:false,plan:false,parts:false,fv:fvNew(),retake:false,closed:false,claim:false,night:false,chat:[["a","Hi Sam. I talk to every street&rsquo;s Asset Steward. Ask me what needs you, or pick a question below."]],
  log:[["Wed 22:00","Asset Steward","Nightly check: 6 posts healthy. No changes."]],mem:["LP-14 had an RCD replaced in March (job J-20311).","Van 12 covers Bexley."]}}
var st=fresh();try{if(location.hash==='#board')st.view='board';else if(location.hash==='#workspace')st.view='ws'}catch(_){}

function stState(){ // Station Rd slices
  var s="gggggggggggg".split("");
  if(st.hb==="done"){s[3]="r"}
  if(st.repair&&!st.plan){s[1]="w"}
  if(st.fv&&fvBad()){s[6]="w"}
  if(st.closed&&!st.claim){s[9]="w"}
  if(st.night){s[3]="g"}
  return s}
function streetStates(i){return i===0?(st.hb==="idle"?"gggggggggggg".split(""):stState()):STREETS[i][3].split("")}
function roll(s){return s.indexOf("r")>=0?"r":s.indexOf("w")>=0?"w":s.indexOf("s")>=0?"s":"g"}
var LBL={g:"Good",w:"Attention",r:"Problem",s:"Not reporting"};
function ring(s,size){var n=s.length,o=[],R=48,r=28;for(var i=0;i<n;i++){var a0=-Math.PI/2+i*2*Math.PI/n+.03,a1=-Math.PI/2+(i+1)*2*Math.PI/n-.03;
  function p(a,rad){return (50+rad*Math.cos(a)).toFixed(2)+" "+(50+rad*Math.sin(a)).toFixed(2)}
  o.push('<path d="M'+p(a0,R)+" A"+R+" "+R+" 0 0 1 "+p(a1,R)+" L"+p(a1,r)+" A"+r+" "+r+" 0 0 0 "+p(a0,r)+'Z" style="fill:var(--'+({g:"brand",w:"warn",r:"crit",s:"border"})[s[i]]+')"><title>'+JOBS[i]+": "+LBL[s[i]]+'</title></path>')}
  return '<svg class="ring" viewBox="0 0 100 100" width="'+size+'" height="'+size+'" aria-hidden="true">'+o.join("")+'</svg>'}
function dots(s){return '<span class="dots">'+s.map(function(c,i){return '<i class="'+c+'" title="'+JOBS[i]+'"></i>'}).join("")+'</span>'}
function stl(c){return '<span class="st '+c+'"><i class="'+c+'"></i>'+LBL[c]+'</span>'}
function lv(n){return '<span class="lvl l'+n+'">L'+n+'</span>'}
function cur(){return STEPS[st.step]}
function isCur(id){return cur()&&cur().id===id}
function complete(id){var i=STEPS.findIndex(function(x){return x.id===id});if(i<0)return;st.done[id]=true;if(st.step===i){st.step=Math.min(i+1,STEPS.length-1);if(i===STEPS.length-1)st.step=i}}
function toast(t){var e=$("toast");e.innerHTML=t;e.classList.remove("hide");clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.add("hide")},2600)}
function addLog(t,w,x){st.log.unshift([t,w,x])}

/* ---------- top tabs ---------- */
function renderTabs(){var T=[["home","Home"],["street","Station Rd"],["board","Board"],["ws","Workspace"],["brief","Monday brief"]];
  $("tabs").innerHTML=T.map(function(t){var on=st.view===t[0];var pul=(t[0]==="brief"&&isCur("brief"));if(t[0]==="board"){var nd=notches().filter(function(x){return x.c==="decide"}).length;return '<button data-nav="board" class="hl'+(on?" on":"")+'" title="The same day as a Kanban board">&#9638; Board'+(nd?'<span class="tcnt" title="Waiting on a person">'+nd+'</span>':'<span class="tnew">New</span>')+'</button>'}

/* ---------- home ---------- */
function renderHome(){var rows=STREETS.map(function(r,i){var s=streetStates(i),rr=roll(s);var chk=st.hb==="run"&&i>st.hbi;var hl=(i===0&&st.hb==="done");
   var last=st.hb==="idle"?"Yesterday 06:00":(chk?"checking&hellip;":"Today 06:00");
   return '<tr class="click'+(chk?" checking":"")+(hl?" hl":"")+'" data-open="'+i+'"><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+dots(s)+'</td><td>'+(chk?'<span class="st s">&hellip;</span>':stl(rr))+'</td><td>'+last+'</td></tr>'}).join("");
  var red=0,att=0,down=0;STREETS.forEach(function(r,i){var x=roll(streetStates(i));if(x==="r")red++;if(x==="w"||x==="s")att++});down=(st.hb!=="idle"&&!st.night)?1:0;

    return '<div class="kcol"><div class="kh"><b>'+c[1]+'</b><span>'+items.length+'</span></div>'+(items.length?items.map(function(x){var open=sel===x.id;
      return '<div class="kc'+(open?" open":"")+(x.c==="decide"?" dec":"")+'" data-nsel="'+x.id+'"><div class="kt">'+(x.p?'<span class="pb '+(x.p<"P4"?"c":(x.p<"P6"?"w":"b"))+'">'+x.p+'</span>':'')+'<span class="kk">'+x.k+'</span><span class="kid">'+x.id+'</span></div><b>'+x.t+'</b><div class="km"><span class="anc">&#9875; '+x.a+'</span>'+whoChip(x.w)+'</div>'+
       (open?'<div class="kd"><p><span>Goal</span>'+x.g+'</p>'+(x.par?'<p><span>Parent</span>'+x.par+'</p>':'')+(x.r?'<p><span>Receipt</span>'+x.r+'</p>':'<p><span>Receipt</span>Not yet. An agent can&rsquo;t mark it Done without one.</p>')+'</div>':'')+'</div>'}).join(""):'<p class="kempty">Nothing here</p>')+'</div>'}).join("")}
function renderBoard(){var ns=notches();
  var filt=st.bfilt||"all";ns=ns.filter(function(x){return filt==="all"||WHO[x.w][1]===filt});
  var done=notches().filter(function(x){return x.c==="done"&&WHO[x.w][1]==="agent"});
  var cols=kcols(ns);
  var f=[["all","Everyone"],["agent","Agents"],["person","People"]].map(function(x){return '<button class="'+(filt===x[0]?"on":"")+'" data-bfilt="'+x[0]+'">'+x[1]+'</button>'}).join("");
  var mins={Heartbeat:2,Finding:15,"Ask specialist":20,Plan:25,Parts:10,Record:15,Money:30,Verify:10};var m=done.reduce(function(a,x){return a+(mins[x.k]||10)},0);
  return '<div class="crumb">Notchi &rsaquo; Workspace: Field Central &middot; Bexley &rsaquo; Board</div>'+
  '<div class="cham ph"><span class="obj">NB</span><div><h1>Bexley fleet board</h1><small>The same day as Notchi notches: agents and people on one board. Every notch is anchored to a record and closes with a receipt.</small></div><div class="acts"><div class="seg">'+f+'</div></div></div>'+
  '<div class="kpis"><div class="cham kpi"><b>'+done.length+'</b><small>notches done by agents today</small></div><div class="cham kpi"><b>'+(m/60).toFixed(1)+' h</b><small>estimated work done by agents</small></div><div class="cham kpi'+(notches().filter(function(x){return x.c==="decide"}).length?" r":"")+'"><b>'+notches().filter(function(x){return x.c==="decide"}).length+'</b><small>waiting on a person</small></div><div class="cham kpi"><b>3</b><small>agents: operations manager, street minion, specialist</small></div></div>'+
  '<div class="kwrap"><div class="kboard">'+cols+'</div></div>'+
  '<p class="note" style="font-size:12px;margin-top:8px">Click a card for its goal and receipt. Run the demo guide and watch cards move. &ldquo;Verifying&rdquo; means the agent posted a receipt and the next heartbeat checks it before Done.</p>'+
  '<details class="bmore"><summary>Who works on this board, and what&rsquo;s already built in Notchi</summary><div class="bstack"><div class="cham card"><h3>Who works on this board</h3><ul class="roles">'+
   '<li>'+whoChip("om")+'<span>One per region (optional hierarchy). Plans visits, talks to the minions, escalates to people.</span></li>'+
   '<li>'+whoChip("mn")+'<span>One per street (site entity). Runs the heartbeat, finds problems, does the routine work.</span></li>'+
   '<li>'+whoChip("sp")+'<span>One per company. A performance engineer that learns from every minion; minions ask it before escalating.</span></li>'+
   '<li>'+whoChip("sam")+whoChip("dev")+'<span>People: decisions, money, safety, and work on site.</span></li></ul></div>'+
  '<div class="cham card"><h3>Under the hood: checked in the Notchi code <span class="sp note" style="font-size:11px;font-weight:400">main, 25 Oct</span></h3><table class="t ut"><thead><tr><th>Need</th><th>Status</th></tr></thead><tbody>'+
   '<tr><td>One agent per record, daily sweep, worst-first status roll-up</td><td><span class="ex">Built</span> Notchi, behind a flag (on for Tower Program)</td></tr>'+'<tr><td>Agents as assignees; receipts; Done verified by the next heartbeat</td><td><span class="ex">Built</span> Notchi</td></tr>'+'<tr><td>Work log with estimated hours</td><td><span class="ex">Built</span> Notchi</td></tr>'+'<tr><td>Agents delegating to other agents and people; escalation</td><td><span class="ex">Built</span> Notchi (pursue mode)</td></tr>'+'<tr><td>Memory per notch</td><td><span class="ex">Built</span> Notchi</td></tr>'+'<tr><td>Custom agent page inside a workspace</td><td><span class="gp">One-off</span> only the siting workbench</td></tr>'+'<tr><td>Specialist and operations manager roles</td><td><span class="nw">New</span> could ride on delegation</td></tr>'+'<tr><td>Chargers and other field assets as anchored records</td><td><span class="gp">Gap</span> sweep covers Projects today</td></tr>'+'<tr><td>Scout side: task ingress, receipts</td><td><span class="gp">Gap</span> SCOUT-21808</td></tr>'+'<tr><td>Monitoring data (e.g. OCPP charger alarms)</td><td><span class="nw">New</span> Brock building OCPP</td></tr></tbody></table></div></div></details>'}

function renderBrief(){var ready=st.night;
  return '<div class="crumb">Field Assets &rsaquo; Monday brief</div><div class="cham ph"><span class="obj">MB</span><div><h1>Monday brief &middot; Sam</h1><small>Written by the operations manager from every street minion &middot; Mon 06:30</small></div></div>'+
  (ready?'<div class="two"><div class="cham card"><h3>Needs you this week</h3><ol style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.8"><li>Church Ln LP-22 offline 3 days: escalate to the maker?</li><li>Mill Hill yearly checks overdue by 4 days: approve the plan.</li><li>Grove Pl: 2 posts need a socket; parts arrive Wednesday.</li></ol></div>'+
   '<div class="cham card"><h3>Done for you last week</h3><div class="kpis" style="grid-template-columns:1fr 1fr;margin:0"><div class="cham kpi"><b>640</b><small>streets checked daily</small></div><div class="cham kpi"><b>9</b><small>repairs put on yearly-check trips</small></div><div class="cham kpi"><b>14</b><small>parts reserved</small></div><div class="cham kpi"><b>3</b><small>warranty claims drafted</small></div></div><p class="note" style="margin-top:8px">Including Station Rd: LP-14 fixed on one trip, claim WC-0412 submitted.</p></div></div>':
   '<div class="cham card"><p class="empty">Finish the day first: the brief is written after the nightly run.</p></div>')}

/* ---------- copilot ---------- */
var Q=[["need","Which streets need me today?"],["why","Why is Station Rd red?"],["part","Do we have the part for Thursday?"],["warr","Is LP-14 under warranty?"],["week","What did the minions do last week?"],["spec","Did it check with the Specialist?"]];
function answer(k){var red=st.hb!=="idle";
  if(k==="need")return red?(st.night?"<b>Nothing is red.</b> 2 streets need attention: Church Ln (LP-22 offline) and Mill Hill (checks overdue).<span class=cite>Answered from minion status: 1 step, 0 AI tokens</span>":"<b>1 street is red:</b> Station Rd, Bexley (LP-14 tripping, repair drafted). 3 need attention: Church Ln, Mill Hill, Elm Gr.<span class=cite>Answered from minion status: 1 step, 0 AI tokens</span>"):"The minions haven&rsquo;t run yet today. Run the 06:00 heartbeat on Home.<span class=cite>1 step, 0 AI tokens</span>";
  if(k==="why")return red&&!st.night?"Its <b>Health score</b> slice is red: LP-14 tripped 9 times overnight with a ground fault, same as March. Every other job is fine.<span class=cite>Read from the Station Rd minion: 1 step, 0 AI tokens</span>":"Station Rd is not red right now.<span class=cite>1 step, 0 AI tokens</span>";
  if(k==="part")return st.parts?"Yes. <b>1&times; RCD 40A Type B</b> is reserved on Van 12 for J-30412.<span class=cite>Parts Autopilot: 1 step</span>":(st.plan?"Van 12 has 1 RCD 40A Type B. It isn&rsquo;t reserved yet: approve it on Parts Autopilot.<span class=cite>Parts Autopilot: 1 step</span>":"There&rsquo;s no visit planned yet, so no parts list.<span class=cite>1 step</span>");
  if(k==="warr")return "Yes. LP-14&rsquo;s charger unit is under the maker&rsquo;s warranty until <b>June 2027</b>, and the RCD is covered."+(st.claim?" Claim WC-0412 is submitted.":"")+"<span class=cite>Warranty &amp; Billing: 1 step</span>";
  if(k==="week")return "Last week the minions checked 640 streets every day, put 9 repairs on yearly-check trips, reserved 14 parts and drafted 3 warranty claims.<span class=cite>Summary written by the operations manager: uses AI</span>";
  if(k==="spec")return red?"Yes. Before drafting the repair, the Station Rd minion asked the <b>Specialist</b>. Answer: the same RCD batch failed on 11 of 99 posts this year; fit batch B, and replace the charger unit if LP-14 fails again. Nobody had to be woken up.<span class=cite>Notch N-103: 1 step</span>":"The minions haven&rsquo;t run yet today, so nothing has gone to the Specialist.<span class=cite>1 step</span>";
  return "In this prototype I can answer: which streets need you, why a street is red, parts for Thursday, warranty, and last week."}
function ask(k,text){st.chat.push(["u",text]);st.chat.push(["a",answer(k)]);if(k==="need"&&st.hb==="done")complete("ask");render();var c=$("chat");c.scrollTop=c.scrollHeight}
function renderChat(){$("chat").innerHTML=st.chat.map(function(m){return '<div class="m '+m[0]+'">'+m[1]+'</div>'}).join("");
  $("sugg").innerHTML=Q.map(function(q){return '<button data-ask="'+q[0]+'" class="'+(q[0]==="need"&&isCur("ask")?"pulse":"")+'">'+q[1]+'</button>'}).join("")}

/* ---------- Workspace mock: Field Central, Bexley ---------- */
function renderWS(){var ns=notches(),cnt=COLS.map(function(c){return [c[1],ns.filter(function(x){return x.c===c[0]}).length]});
  var dec=ns.filter(function(x){return x.c==="decide"||x.c==="agent"}).slice(0,3);
  var s=st.hb==="idle"?"gggggggggggg".split(""):stState(),rr=roll(s);
  var nav='<nav class="wsnav" aria-label="Workspace"><h4>Agents</h4>'+
   '<button data-nav="street"><i class="'+rr+'"></i>Station Rd minion<em>street</em></button>'+
   '<button data-wsx="1"><i class="w"></i>Church Ln minion<em>street</em></button>'+
   '<button data-wsx="1"><i class="g"></i>10 more minions</button>'+
   '<button data-nav="brief"><i class="g"></i>Operations manager<em>region</em></button>'+
   '<button data-wsx="1"><i class="w"></i>Specialist<em>company</em></button>'+
   '<h4>Boards</h4><button data-nav="board">Bexley fleet board<em>'+ns.length+'</em></button>'+
   '<h4>Scout tables</h4><button data-wsx="1">Chargers<em>99</em></button><button data-wsx="1">Charger alarms (OCPP)<em>live</em></button><button data-wsx="1">Work orders</button>'+
   '<h4>Docs</h4><button data-wsx="1">Station Rd runbook</button><button data-wsx="1">Specialist lessons</button><button data-wsx="1">Bexley council contract</button></nav>';
  var agent='<div class="cham card"><h3>Agent page: Station Rd minion <span class="agt">HTML page</span></h3><div style="display:flex;gap:12px;align-items:center">'+ring(s,52)+'<div><b>Station Rd, Bexley</b><br><small class="note">6 posts &middot; '+(st.hb==="idle"?"heartbeat at 06:00":"last heartbeat today 06:00")+'</small></div><span class="sp">'+stl(rr)+'</span></div>'+
   '<ul class="mlist" style="margin-top:10px">'+(pending().length?pending().slice(0,3).map(function(x){return '<li><span class="pb '+(x[4]<'P4'?'c':'b')+'">'+x[4]+'</span><span>'+x[2]+'</span><span>'+x[0]+'</span></li>'}).join(""):'<li><span>Nothing waiting for you.</span></li>')+'</ul>'+
   '<div class="btns"><button class="btn" data-nav="street">Open agent page</button></div></div>';
  var board='<div class="cham card"><h3>Board: Bexley fleet <span class="agt">Notchi board</span></h3><div class="minik">'+cnt.map(function(c){return '<div><b>'+c[1]+'</b><small>'+c[0]+'</small></div>'}).join("")+'</div>'+
   '<ul class="mlist">'+dec.map(function(x){return '<li>'+whoChip(x.w)+'<span>'+x.t+'</span><span>'+x.id+'</span></li>'}).join("")+'</ul><div class="btns"><button class="btn" data-nav="board">Open board</button></div></div>';
  var al=[["LP-14","Station Rd","Ground fault (RCD trip)",st.hb==="idle"?"&ndash;":(st.night?"0":"9"),st.night?"g":(st.hb==="idle"?"g":"r")],["LP-22","Church Ln","Offline (no heartbeat)","1","w"],["GP-03","Grove Pl","Connector lock error","2","w"],["MH-07","Mill Hill","None","0","g"]];
  var table='<div class="cham card"><h3>Scout table: Charger alarms <span class="agt">OCPP feed</span></h3><div class="twrap" style="margin-top:0"><table class="t"><thead><tr><th>Charger</th><th>Street</th><th>Last alarm</th><th>Overnight</th></tr></thead><tbody>'+al.map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+stl(r[4]).replace(LBL[r[4]],r[3])+'</td></tr>'}).join("")+'</tbody></table></div><p class="note" style="font-size:11.5px;margin:8px 0 0">Minions read this table on every heartbeat. Read-only: no remote resets.</p></div>';
  var docs='<div class="cham card"><h3>Docs <span class="agt">shared with agents</span></h3><ul class="mlist">'+
   '<li><span class="kk">Runbook</span><span>Station Rd: how this street is looked after</span><span>minion</span></li>'+
   '<li><span class="kk">Lessons</span><span>RCD batch A: 11 of 99 failed. Fit batch B.</span><span>Specialist</span></li>'+
   '<li><span class="kk">Contract</span><span>Bexley council: 72 h fix, yearly checks by 31 Oct</span><span>person</span></li>'+
   '<li><span class="kk">Brief</span><span>Monday brief for Sam</span><span>ops manager</span></li></ul><p class="note" style="font-size:11.5px;margin:8px 0 0">Agents read and write these the same way people do. Every edit is logged.</p></div>';
  return '<div class="crumb">Notchi &rsaquo; Workspace: Field Central &middot; Bexley</div>'+
  '<div class="cham ph"><span class="obj">WS</span><div><h1>Field Central &middot; Bexley</h1><small>One Notchi workspace: the agent&rsquo;s own page, its board, the Scout tables it reads and the docs it keeps, side by side</small></div></div>'+
  '<div class="ws">'+nav+'<div><div class="wsg">'+agent+board+table+docs+'</div>'+
  '<div class="wsgap"><b>What this needs in Notchi:</b> a way to give an agent its own page inside a workspace, next to its board, tables and docs. Today only the siting workbench has a custom page, built one-off. A shared &ldquo;agent with a toolkit and a page&rdquo; building block would let every agent have one.</div></div></div>'}

/* ---------- actions ---------- */
var A={
 hb:function(){if(st.hb!=="idle")return;st.hb="run";st.hbi=-1;render();var t=setInterval(function(){st.hbi++;if(st.hbi>=STREETS.length){clearInterval(t);st.hb="done";addLog("Wed 06:00","Asset Health","LP-14: 9 trips since 00:00, ground fault. Health 31.");addLog("Wed 06:01","Specialist","Asked by the Station Rd minion about LP-14. Same RCD batch failed on 11 of 99 posts; advised fitting batch B.");addLog("Wed 06:01","Asset Health","Drafted repair J-30412 (RCD batch B).");complete("hb");toast("Heartbeat done. Station Rd is red.")}render()},140)},
 repair:function(){st.repair=true;addLog("Wed 07:18","Sam (approved)","Repair job J-30412 for LP-14.");complete("health");toast("Repair approved. PM Autopilot is planning the visit.")},
 plan:function(){st.plan=true;addLog("Wed 07:19","PM Autopilot","Bundled J-30412 with 6 yearly checks. Handed to Dispatch: Dev, Thu 09:00.");complete("pm");toast("Plan approved: one trip instead of two.")},
 parts:function(){st.parts=true;addLog("Wed 07:20","Parts Autopilot","Reserved 1 RCD 40A Type B on Van 12.");complete("parts");toast("RCD reserved on Van 12.")},
 fvall:function(){st.fv.s.forEach(function(x,i){if(x==="todo")fvEval(i,true)});render()},
 close:function(){st.closed=true;addLog("Thu 12:05","Dev","Closed J-30412.");addLog("Thu 12:06","Warranty &amp; Billing","Drafted claim WC-0412 with evidence.");toast("Job closed. Claim drafted.")},
 claim:function(){st.claim=true;addLog("Thu 12:30","Sam (sent)","Warranty claim WC-0412 submitted to the maker.");complete("claim");toast("Claim sent by Sam.")},
 night:function(){st.night=true;addLog("Thu 22:00","Asset Health","14 clean sessions on LP-14. Health 78. Street green.");st.mem.push("LP-14: RCD failed twice in 7 months. If it fails again, recommend replacing the charger unit.");st.mem.push("Bundle Station Rd yearly checks with any repair in October.");st.mem.push("From the Specialist: fit RCD batch B on this street.");complete("night");toast("Nightly done. The minion remembers.")},
 noop:function(){toast("In the real product this opens an edit form.")}
};
function go(view){if(view.indexOf("street:")===0){st.view="street";st.tab=view.split(":")[1]}else st.view=view}
function auto(){var c=cur();if(st.done[c.id])return;
  var seq={hb:function(){go("home");A.hb()},ask:function(){if(st.hb!=="done"){A.hb();return}ask("need",Q[0][1])},open:function(){st.view="street";st.tab="overview";complete("open")},
   health:function(){go("street:health");if(st.hb==="done")A.repair()},pm:function(){go("street:pm");A.plan()},parts:function(){go("street:parts");A.parts()},
   photos:function(){go("street:fv");st.fv.s.forEach(function(v,i){if(v!=="ok"){if(FVI[i].firstBad)st.fv.retaken[i]=true;fvEval(i,true)}})},
   claim:function(){go("street:wb");if(!st.closed)A.close();A.claim()},night:function(){go("street:log");A.night()},brief:function(){st.view="brief";complete("brief")}};
  seq[c.id]();render()}

/* ---------- render + events ---------- */
function render(){document.querySelector(".app").classList.toggle("wide",st.view==="board"||st.view==="ws"||(st.view==="street"&&st.sview==="board"));renderTabs();renderGuide();$("main").innerHTML=st.view==="home"?renderHome():st.view==="street"?renderStreet():st.view==="board"?renderBoard():st.view==="ws"?renderWS():renderBrief();renderChat()}
document.addEventListener("click",function(e){var nc=e.target.closest("[data-nsel]");if(nc){st.bsel=st.bsel===nc.dataset.nsel?null:nc.dataset.nsel;render();return}var sel=e.target.closest("[data-fvsel]");if(sel&&!e.target.closest("button")){st.fv.sel=+sel.dataset.fvsel;render();return}var t=e.target.closest("button,tr,a");if(!t)return;
  if(t.dataset.nav){st.view=t.dataset.nav;if(st.view==="street"){if(isCur("open"))complete("open")}if(st.view==="brief"&&isCur("brief")&&st.night)complete("brief");render();window.scrollTo(0,0);return}
  if(t.dataset.open!==undefined){if(t.dataset.open==="0"){st.view="street";st.tab="overview";if(isCur("open"))complete("open");render();window.scrollTo(0,0)}else toast("This prototype opens Station Rd. Other streets work the same way.");return}
  if(t.dataset.wsx){toast("In the real workspace this opens here. The prototype opens the agent page, board and brief.");return}
  if(t.dataset.sview){st.sview=t.dataset.sview;render();return}
  if(t.dataset.tab){st.sview="list";st.tab=t.dataset.tab;render();return}
  if(t.dataset.bfilt){st.bfilt=t.dataset.bfilt;render();return}
  if(t.dataset.fvsel!==undefined){st.fv.sel=+t.dataset.fvsel;render();return}
  if(t.dataset.fvtake!==undefined){fvEval(+t.dataset.fvtake);render();return}
  if(t.dataset.fvretake!==undefined){fvRetake(+t.dataset.fvretake);render();return}
  if(t.dataset.fvup!==undefined){var fi=$("fvfile");fi.dataset.i=t.dataset.fvup;fi.value="";fi.click();return}
  if(t.dataset.act){var f=A[t.dataset.act];if(f){f();render()}return}
  if(t.dataset.ask){var q=Q.find(function(x){return x[0]===t.dataset.ask});ask(q[0],q[1]);return}
  if(t.dataset.gostep!==undefined){st.step=+t.dataset.gostep;var v=STEPS[st.step].view;if(v.indexOf("street")===0&&st.hb!=="idle")go(v);else if(v==="home"||v==="brief")go(v);render();return}
  if(t.dataset.auto){auto();return}
  if(t.dataset.reset){st=fresh();render();toast("Demo reset.");return}
});
$("fvfile").addEventListener("change",function(){var f=this.files&&this.files[0],i=+this.dataset.i;if(!f)return;var r=new FileReader();r.onload=function(){st.fv.img[i]=r.result;fvEval(i)};r.readAsDataURL(f)});
$("cform").addEventListener("submit",function(e){e.preventDefault();var v=$("cinput").value.trim();if(!v)return;$("cinput").value="";var l=v.toLowerCase();
  var k=/need|today|red street|which/.test(l)?"need":/why|red/.test(l)?"why":/part|van|stock|rcd/.test(l)?"part":/warrant|claim/.test(l)?"warr":/special|engineer|expert/.test(l)?"spec":/week|did|summary/.test(l)?"week":"x";ask(k,v)});
// theme
var root=document.documentElement;
function setT(t){root.setAttribute("data-theme",t);[].forEach.call(document.querySelectorAll("[data-theme-set]"),function(b){b.setAttribute("aria-pressed",b.dataset.themeSet===t?"true":"false")});try{localStorage.setItem("st-theme",t)}catch(_){}}
var sv=null;try{sv=localStorage.getItem("st-theme")}catch(_){}
setT(sv||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
[].forEach.call(document.querySelectorAll("[data-theme-set]"),function(b){b.addEventListener("click",function(){setT(b.dataset.themeSet)})});
render();
})();
</script>
